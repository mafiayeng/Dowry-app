<!DOCTYPE html>
<html>
<head><title>Reset Password – GoldenVow</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<style>
body { background: linear-gradient(135deg, #0D1B2A 0%, #1A2A3A 50%, #2C3E50 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; font-family: 'Inter', sans-serif; }
.card { background: rgba(255,255,255,0.95); backdrop-filter: blur(20px); border-radius: 40px; padding: 50px 40px; max-width: 450px; width: 100%; box-shadow: 0 40px 80px rgba(0,0,0,0.6); border: 1px solid rgba(212,175,55,0.2); }
.brand-name { font-family: 'Playfair Display', serif; font-size: 2.5rem; font-weight: 700; color: #1A2A3A; text-align: center; }
.brand-name span { color: #D4AF37; }
.btn-gold { background: #D4AF37; border: none; color: #1A2A3A; font-weight: 600; padding: 12px; border-radius: 60px; width: 100%; transition: 0.3s; }
.btn-gold:hover { background: #C5A02E; transform: scale(1.02); box-shadow: 0 10px 30px rgba(212,175,55,0.3); }
.form-control { border-radius: 60px; padding: 12px 20px; border: 1px solid #e9ecef; }
.form-control:focus { border-color: #D4AF37; box-shadow: 0 0 0 0.2rem rgba(212,175,55,0.2); }
</style>
</head>
<body>
<div class="card">
    <div class="brand-name">Golden<span>Vow</span></div>
    <p class="text-center text-muted">Set your new password</p>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}<div class="alert alert-{{ cat }}">{{ msg }}</div>{% endfor %}
    {% endwith %}
    <form method="post">
        <div class="mb-3"><input class="form-control" name="password" type="password" placeholder="New Password" required></div>
        <div class="mb-3"><input class="form-control" name="confirm_password" type="password" placeholder="Confirm Password" required></div>
        <button class="btn-gold"><i class="bi bi-check-circle"></i> Reset Password</button>
    </form>
</div>
</body>
</html>
