<!DOCTYPE html>
<html>
<head><title>Register</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5" style="max-width:400px;">
    <h2 class="text-center">📝 Register Admin</h2>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="alert alert-{{cat}}">{{msg}}</div>
      {% endfor %}
    {% endwith %}
    <form method="post">
        <div class="mb-2"><input class="form-control" name="username" placeholder="Username" required></div>
        <div class="mb-2"><input class="form-control" name="email" placeholder="Email" required></div>
        <div class="mb-2"><input class="form-control" name="phone" placeholder="Phone (for notifications)"></div>
        <div class="mb-2"><input class="form-control" name="password" type="password" placeholder="Password" required></div>
        <button class="btn btn-success w-100">Create Admin</button>
    </form>
    <p class="mt-3 text-center"><a href="/login">Already have an account?</a></p>
</div>
</body>
</html>
