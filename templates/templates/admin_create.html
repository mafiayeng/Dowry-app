<!DOCTYPE html>
<html>
<head><title>Create</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4" style="max-width:600px;">
<a href="/admin" class="btn btn-secondary mb-3">← Back</a>
<h2>✨ Create New Dowry</h2>
<form method="post">
<div class="mb-2"><label>Dowry Name</label><input class="form-control" name="title" placeholder="e.g., Mary's Dowry" required></div>
<div class="mb-2"><label>Description</label><textarea class="form-control" name="description"></textarea></div>
<div class="mb-2"><label>Target (KES)</label><input class="form-control" name="target_amount" type="number" step="0.01" required></div>
<div class="mb-2"><label>Contribution Deadline</label><input class="form-control" name="deadline" type="date" required></div>
<div class="mb-2"><label>Dowry Day</label><input class="form-control" name="dowry_date" type="date" required></div>
<button class="btn btn-success w-100">🎉 Create</button>
</form>
</div>
</body>
</html>
