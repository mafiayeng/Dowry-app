<!DOCTYPE html>
<html>
<head><title>Contact – GoldenVow</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<style>
body { background: linear-gradient(135deg, #0D1B2A 0%, #1A2A3A 50%, #2C3E50 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; font-family: 'Inter', sans-serif; }
.contact-card { background: rgba(255,255,255,0.95); backdrop-filter: blur(20px); border-radius: 40px; padding: 50px 40px; max-width: 550px; width: 100%; box-shadow: 0 40px 80px rgba(0,0,0,0.6); border: 1px solid rgba(212,175,55,0.2); transition: transform 0.3s ease; }
.contact-card:hover { transform: translateY(-5px); }
.logo-icon { font-size: 3rem; color: #D4AF37; display: block; text-align: center; }
.brand-name { font-family: 'Playfair Display', serif; font-size: 2.5rem; font-weight: 700; color: #1A2A3A; text-align: center; }
.brand-name span { color: #D4AF37; }
.brand-sub { font-family: 'Playfair Display', serif; font-style: italic; text-align: center; color: #6c757d; letter-spacing: 3px; }
.btn-gold { background: #D4AF37; border: none; color: #1A2A3A; font-weight: 600; padding: 12px; border-radius: 60px; width: 100%; transition: 0.3s; }
.btn-gold:hover { background: #C5A02E; transform: scale(1.02); box-shadow: 0 10px 30px rgba(212,175,55,0.3); }
.form-control { border-radius: 60px; padding: 12px 20px; border: 1px solid #e9ecef; }
.form-control:focus { border-color: #D4AF37; box-shadow: 0 0 0 0.2rem rgba(212,175,55,0.2); }
.form-label { font-weight: 600; color: #1A2A3A; }
.footer-links { margin-top: 25px; text-align: center; font-size: 0.7rem; color: #6c757d; }
.footer-links a { color: #6c757d; text-decoration: none; margin: 0 5px; }
.footer-links a:hover { color: #D4AF37; }
</style>
</head>
<body>
<div class="contact-card">
    <span class="logo-icon">✦</span>
    <div class="brand-name">Golden<span>Vow</span></div>
    <div class="brand-sub"><em>Tunza Mila</em> · Nurture Tradition</div>
    <div class="text-center mt-3 mb-3"><small style="color: #6c757d;">We're here to help</small></div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}<div class="alert alert-{{ cat }}">{{ msg }}</div>{% endfor %}
    {% endwith %}

    <form method="post">
        <div class="mb-3"><label class="form-label">Your Name *</label><input class="form-control" name="name" placeholder="e.g., John Doe" required></div>
        <div class="mb-3"><label class="form-label">Email Address *</label><input class="form-control" name="email" type="email" placeholder="you@example.com" required></div>
        <div class="mb-3"><label class="form-label">Phone Number (optional)</label><input class="form-control" name="phone" placeholder="0712345678"></div>
        <div class="mb-3"><label class="form-label">Subject *</label>
            <select class="form-select" name="subject" required>
                <option value="">Select a subject</option>
                <option value="Report Fraud">🚨 Report Fraud</option>
                <option value="App Adjustment">⚙️ Request App Adjustment</option>
                <option value="Bug Report">🐛 Report a Bug</option>
                <option value="Suggestion">💡 Suggestion</option>
                <option value="Other">📩 Other</option>
            </select>
        </div>
        <div class="mb-3"><label class="form-label">Message *</label><textarea class="form-control" name="message" rows="4" placeholder="Describe your issue or request in detail..." required></textarea></div>
        <button class="btn-gold"><i class="bi bi-send"></i> Send Message</button>
    </form>

    <div class="footer-links">
        <a href="/">Home</a> ·
        <a href="/about">Why GoldenVow?</a> ·
        <a href="/contact">Contact Us</a> ·
        <a href="https://wa.me/{{ support_whatsapp }}" target="_blank">WhatsApp</a> ·
        <a href="mailto:{{ support_email }}">Email</a>
        <br><br>
        <span class="text-muted">© 2026 GoldenVow · Tunza Mila</span>
    </div>
</div>
</body>
</html>
